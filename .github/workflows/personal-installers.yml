# SPDX-License-Identifier: GPL-3.0-or-later
name: Personal installers

on:
  push:
    branches: [build/personal-installers-8a9d2f9]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.12.0"

jobs:
  desktop:
    name: Windows app (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          # Qt 6.12's repository layout needs a current aqtinstall.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
      - name: Release build
        run: cargo build --locked --release -p nectarlink-desktop -p nectarlink-vcam
      - name: Install NSIS
        shell: pwsh
        run: ./scripts/install-nsis.ps1
      - name: Installer
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild
      - name: Open the main window, with no QML warnings
        shell: pwsh
        run: ./scripts/ui-check.ps1
      - name: Install, run and uninstall it
        shell: pwsh
        run: ./scripts/smoke-installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: nectarlink-windows-x64
          path: target/package/*-setup.exe
          retention-days: 3
          if-no-files-found: error

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain and the Android targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          # Command-line tools 23.0: older versions don't list platform 37.0.
          cmdline-tools-version: "16111833"
          packages: "platforms;android-37.0 ndk;30.0.16248370 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and debug build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK signature
        run: >-
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs
          android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: nectarlink-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 3
          if-no-files-found: error
